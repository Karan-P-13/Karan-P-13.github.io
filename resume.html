<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Preview - Karan P</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            overflow: hidden; /* Prevent scrolling behind the PDF */
        }
        .resume-page-wrapper {
            padding-top: 75px; /* Account for the fixed header */
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header-controls {
            display: none; /* Hide the extra controls to maximize PDF space */
        }
        .resume-container {
            width: 100vw;
            flex-grow: 1;
            border-radius: 0;
            margin: 0;
            border: none;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.5); /* Dim background behind the resume */
            padding: 2rem 0;
        }
        .resume-container img {
            width: 100%;
            max-width: 850px;
            height: auto;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            align-self: flex-start;
        }
    </style>
</head>
<body>
    <!-- Custom Cursor -->
    <div id="cursor"></div>

    <!-- Ambient Background -->
    <div class="bg-blobs">
        <div class="blob blue"></div>
        <div class="blob red"></div>
        <div class="blob purple"></div>
    </div>

    <header>
        <nav>
            <div class="logo">KARAN P.</div>
            <ul class="nav-links" style="display: flex;">
                <li><a href="index.html" style="display: flex; align-items: center; gap: 0.5rem;"><i class="fas fa-arrow-left"></i> Back to Portfolio</a></li>
            </ul>
        </nav>
    </header>

    <div class="resume-page-wrapper">
        <div class="header-controls">
            <h2>Resume Preview</h2>
            <a href="Karan_P_Resume.pdf" download="Karan_P_Resume.pdf" class="btn primary"><i class="fas fa-download"></i> Download PDF</a>
        </div>

        <div class="resume-container">
            <img src="resume_preview.png" alt="Karan P Resume">
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
